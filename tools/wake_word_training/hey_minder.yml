# MINDER custom wake-word training configuration.
# Run from the openWakeWord training checkout; see ../../MINDER_WAKE_WORD_TRAINING.md.
model_name: "hey_minder"
target_phrase:
  - "hey minder"
custom_negative_phrases:
  # English near-misses / confusables.
  - "hey reminder"
  - "hey mentor"
  - "hey render"
  # Manually curated Spanish/Mexican-Spanish hard negatives. The pinned
  # upstream phoneme-overlap generator is English/CMUdict-only, so keep
  # these explicit phrases in the MINDER corpus.
  - "hey mira"
  - "hey miren"
  - "oye mira"
  - "hoy me enteré"
  - "hey minero"
  - "hey Miguel"
  - "hey mini"
  - "hay menos"

# Minimum recommended positive coverage; increase toward 100k for production quality.
n_samples: 20000
n_samples_val: 2000
tts_batch_size: 25
augmentation_batch_size: 16
augmentation_rounds: 1

# Paths are relative to the training working directory and must be populated
# from the official openWakeWord training notebook/datasets before training.
piper_sample_generator_path: "./vendor/piper-sample-generator"
output_dir: "./artifacts/hey_minder"
rir_paths:
  - "./assets/mit_rirs"
background_paths:
  - "./assets/background_clips"
background_paths_duplication_rate:
  - 1
false_positive_validation_data_path: "./assets/validation_set_features.npy"

feature_data_files:
  "ACAV100M_sample": "./assets/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32
steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
