name: MINDER CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Test provider mode defaults
        run: python -m unittest discover -s tests -v

  provider-regression:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal provider test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyQt6>=6.6,<7" "numpy>=1.24,<3" "google-genai>=2.8,<3" "httpx>=0.27,<1" "psutil>=5.9,<8"
      - name: Run provider regression suite
        run: python -m providers._tests
